name: Keep Masar awake

on:
  schedule:
    # Every 10 minutes. GitHub may start the run a few minutes late.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Masar health
        run: |
          curl --fail --show-error --silent \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 90 \
            "https://masar-f57z.onrender.com/api/health"
